name: Verify VSCode extensions and shared GoogleSQL Core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grammar generation against the canonical dictionaries
        run: python3 scripts/sync_grammar.py --check
      - name: Run Language, Runner and Core unit tests
        run: node --test test/*.test.js runner/test/*.test.js shared/test/*.test.js
      - name: Check committed release VSIX packages before rebuilding
        run: python3 scripts/verify_vsix.py
      - name: Build both standalone VSIX packages
        run: python3 scripts/build_vsix.py
      - name: Check VSIX archives, shared Core and JavaScript imports
        run: python3 scripts/verify_vsix.py
